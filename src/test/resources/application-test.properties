# Test Application Configuration for DockerSample
spring.application.name=docker-sample-test
server.servlet.context-path=/docker

# Kafka Bootstrap - default to localhost:9092 (will be overridden by @DynamicPropertySource if using TestContainers)
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer (test-optimized)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=docker-test-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer (test-optimized)
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=false

# Topic Configuration
kafka.topic.name=com.docker.msg.test

# Kafka Admin - prevent blocking on startup
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=3000
spring.kafka.properties.request.timeout.ms=3000
spring.kafka.properties.default.api.timeout.ms=3000

# Logging (verbose for debugging)
logging.level.com.demo.docker=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.com.att.test=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.boot.autoconfigure.kafka=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.org.springframework.context=DEBUG
logging.level.org.springframework.beans=DEBUG
logging.level.org.springframework.test=DEBUG
